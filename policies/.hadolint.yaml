failure-threshold: warning
ignored:
  - DL3008    # Pin apt-get versions (often impractical)
  - DL3018    # Pin apk versions
trusted-registries:
  - docker.io
  - ghcr.io
  - mcr.microsoft.com
  - public.ecr.aws
  - quay.io
override:
  error:
    - DL3002   # Don't run as root
    - DL3025   # Use JSON form CMD/ENTRYPOINT
    - DL3007   # Don't use :latest
