name: _python

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner for jobs (default ubuntu-latest; set self-hosted to use your own runners).'
        type: string
        default: 'ubuntu-latest'
      tier:
        type: string
        required: true
      run-medium:
        type: string
        default: 'false'
      fail-on:
        type: string
        default: 'high'
      vuln-block-unfixable:
        description: |
          When false (default), dependency vulns with no fix version available
          are reported as warnings instead of blocking — you cannot remediate
          a vuln that has no patched release. Set true to block regardless.
        type: string
        default: 'false'
      vuln-delta-only:
        description: |
          When true (default), only vulns introduced by this PR (vs the base
          branch) block; vulns already present on the base are reported as
          warnings. Keeps unrelated PRs green when a new upstream advisory
          lands on an inherited dependency, and makes the verdict deterministic
          with respect to the change rather than the advisory-feed clock.
        type: string
        default: 'true'
      python-version:
        type: string
        default: '3.11'
      skip-mypy:
        description: |
          Bypass the mypy type-check job for this repo. Mirrors the
          pr-size-guard override: an explicit, owner-approved escape hatch
          for repos that can't satisfy the kit's mypy defaults yet. Prefer
          fixing types over setting this. Default 'false'.
        type: string
        default: 'false'
      test-command:
        description: 'Override the test command. Default: pytest with coverage'
        type: string
        default: ''
      test-paths:
        description: 'Override pytest paths. Default: auto-detect tests/ test/ test_*.py'
        type: string
        default: ''
      diff-coverage-min:
        description: 'Minimum % of CHANGED lines that must be covered by tests (patch coverage).'
        type: string
        default: '80'
      diff-coverage-enforcement:
        description: 'warn (advisory, default) | fail (block PRs below diff-coverage-min).'
        type: string
        default: 'warn'
      test-os:
        description: |
          JSON array of runners for the job matrix. gate.yml passes the resolved
          runner. Set e.g. '["ubuntu-latest","macos-latest","windows-latest"]'
          for libraries/CLIs/native code that must work cross-platform; the
          OS-independent checks run on the first entry only.
        type: string
        default: '["ubuntu-latest"]'
      run-pre-commit:
        description: |
          auto (default): run `pre-commit run --all-files` when
          `.pre-commit-config.yaml` is present, and skip the kit's
          ruff/black/mypy/bandit steps to avoid double-runs with
          conflicting configs.
          force: always run pre-commit (errors if no config file).
          skip:  never run pre-commit even if a config exists.
        type: string
        default: 'auto'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ONE job for lint, types, security, dependency audit and tests: the project
  # is installed once, and the job waits for one runner instead of five.
  # Every check step uses `!cancelled()` so all findings show in one run.
  # On a multi-entry test-os matrix, only the first entry runs the
  # OS-independent checks; the others run tests only.
  python:
    name: Lint, types, security, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.test-os) }}
    runs-on: ${{ matrix.os }}
    env:
      # `uv pip install` targets the setup-python interpreter below.
      UV_SYSTEM_PYTHON: '1'
      FIRST: ${{ strategy.job-index == 0 }}
    steps:
      # fetch-depth: 0 so the diff-coverage gate and the delta vuln scan can
      # find the merge-base with the PR's base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Python tooling
        id: d
        shell: bash
        env:
          MODE: ${{ inputs.run-pre-commit }}
        run: |
          set -euo pipefail
          if   [ -f poetry.lock ];      then PM=poetry LOCK=poetry.lock
          elif [ -f Pipfile.lock ];     then PM=pipenv LOCK=Pipfile.lock
          elif [ -f uv.lock ];          then PM=uv     LOCK=uv.lock
          elif [ -f pdm.lock ];         then PM=pdm    LOCK=pdm.lock
          elif [ -f requirements.txt ]; then PM=pip    LOCK=requirements.txt
          # No lockfile, but a pyproject.toml fully declares the dependency
          # set — enough for pip-audit to resolve and scan.
          elif [ -f pyproject.toml ];   then PM=pip    LOCK=pyproject.toml
          else                               PM=pip    LOCK=none
          fi
          echo "pm=$PM" >> "$GITHUB_OUTPUT"
          echo "lockfile=$LOCK" >> "$GITHUB_OUTPUT"

          # Test discovery (handles non-standard layouts).
          if find . -maxdepth 6 \( -name 'test_*.py' -o -name '*_test.py' -o -name 'conftest.py' \) \
              -not -path './.venv/*' -not -path './node_modules/*' | head -1 | grep -q .; then
            TESTS=true
          else
            TESTS=false
          fi
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

          # Repo-owned pre-commit hooks win over the kit's ruff/black/mypy/bandit.
          HAVE_CFG=false
          if [ -f .pre-commit-config.yaml ] || [ -f .pre-commit-config.yml ]; then HAVE_CFG=true; fi
          case "$MODE" in
            force) RUN=true ;;
            skip)  RUN=false ;;
            *)     RUN=$HAVE_CFG ;;
          esac
          if [ "$MODE" = "force" ] && [ "$HAVE_CFG" = "false" ]; then
            echo "::error::run-pre-commit=force but no .pre-commit-config.yaml found"
            exit 1
          fi
          echo "pre-commit=$RUN" >> "$GITHUB_OUTPUT"

          # Black is the formatter when the repo declares it; else ruff format.
          FMT=ruff
          if [ -f pyproject.toml ] && grep -qE '^\[tool\.black\]' pyproject.toml; then
            FMT=black
          elif [ -f .pre-commit-config.yaml ] && grep -qE '\bblack\b' .pre-commit-config.yaml; then
            FMT=black
          fi
          echo "formatter=$FMT" >> "$GITHUB_OUTPUT"

          MYPY=false
          if [ "$RUN" != "true" ] && [ '${{ inputs.skip-mypy }}' != "true" ]; then MYPY=true; fi
          echo "mypy=$MYPY" >> "$GITHUB_OUTPUT"
          echo "::notice::pm=$PM lockfile=$LOCK tests=$TESTS pre-commit=$RUN (mode=$MODE) formatter=$FMT mypy=$MYPY"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      # uv installs packages far faster than pip. Its GitHub cache is on only
      # for GitHub-hosted runners ('auto'); a self-hosted runner that sets
      # UV_CACHE_DIR to a persistent volume keeps its own cache instead.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # ── Repo-owned hooks (canonical when present) ──
      - name: Cache pre-commit envs
        if: env.FIRST == 'true' && steps.d.outputs.pre-commit == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-config.yml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py${{ inputs.python-version }}-
      - name: Pre-commit (repo hooks)
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.pre-commit == 'true' }}
        run: uvx pre-commit run --all-files --show-diff-on-failure --color always

      # ── Kit lint + format (when the repo has no pre-commit) ──
      # These run BEFORE the project install: the install can create a .venv
      # in the repo, which the scanners would then walk.
      - name: Lint (ruff)
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.pre-commit != 'true' }}
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check --output-format=github'
      - name: Format check (ruff)
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.pre-commit != 'true' && steps.d.outputs.formatter == 'ruff' }}
        run: ruff format --check .
      - name: Format check (black)
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.pre-commit != 'true' && steps.d.outputs.formatter == 'black' }}
        shell: bash
        run: |
          # Match the Black version the repo pins in its pre-commit config.
          BLACK_VER=""
          if [ -f .pre-commit-config.yaml ]; then
            BLACK_VER=$(awk '
              /repo:.*psf\/black/ { in_blk=1; next }
              in_blk && /repo:/ { in_blk=0 }
              in_blk && /rev:/ { gsub(/[ \t"'\'']/,"",$2); print $2; exit }
            ' .pre-commit-config.yaml)
          fi
          echo "::notice::Black is the canonical formatter for this repo (version: ${BLACK_VER:-latest})."
          uvx "black${BLACK_VER:+==$BLACK_VER}" --check .

      # ── Security: bandit. Still runs at main tier with pre-commit present,
      #    so the SARIF is uploaded for tracking. ──
      - name: Security (bandit)
        id: bandit
        if: ${{ !cancelled() && env.FIRST == 'true' && inputs.run-medium == 'true' && (steps.d.outputs.pre-commit != 'true' || inputs.tier == 'main') }}
        run: uvx --from 'bandit[sarif]' bandit -r . -x ./.venv,./node_modules -f sarif -o bandit.sarif --severity-level medium --exit-zero
      - uses: github/codeql-action/upload-sarif@v4
        # The Code Scanning API needs GitHub Advanced Security on private repos.
        # Findings stay visible in the step log either way.
        continue-on-error: true
        if: ${{ !cancelled() && steps.bandit.outcome == 'success' && !github.event.repository.private }}
        with:
          sarif_file: bandit.sarif
          category: bandit

      # ── One project install for mypy and pytest ──
      - name: Install project
        id: install
        if: ${{ !cancelled() && (steps.d.outputs.tests == 'true' || (env.FIRST == 'true' && steps.d.outputs.mypy == 'true')) }}
        shell: bash   # Windows runners default to PowerShell
        run: |
          case '${{ steps.d.outputs.pm }}' in
            poetry) uv pip install poetry && poetry install --no-interaction --no-ansi ;;
            pipenv) uv pip install pipenv && pipenv install --dev --deploy --ignore-pipfile ;;
            uv)     uv sync --frozen ;;
            pdm)    uv pip install pdm && pdm sync ;;
            pip)
              [ -f requirements.txt ] && uv pip install -r requirements.txt
              [ -f requirements-dev.txt ] && uv pip install -r requirements-dev.txt
              [ -f requirements-test.txt ] && uv pip install -r requirements-test.txt
              [ -f pyproject.toml ] && uv pip install -e ".[dev,test]" 2>/dev/null || uv pip install -e . 2>/dev/null || true
              ;;
          esac
          uv pip install pytest pytest-cov

      - name: Cache mypy incremental
        if: env.FIRST == 'true' && steps.d.outputs.mypy == 'true'
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('**/poetry.lock', '**/Pipfile.lock', '**/uv.lock', '**/pdm.lock', '**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ inputs.python-version }}-
      - name: Type check (mypy)
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.mypy == 'true' && steps.install.outcome == 'success' }}
        run: |
          uv pip install mypy
          mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: ${{ inputs.tier == 'dev' }}

      # ── Dependency vulns: severity- and delta-aware pip-audit ──
      - name: Dependency vulns (pip-audit)
        if: ${{ !cancelled() && env.FIRST == 'true' && inputs.run-medium == 'true' }}
        shell: bash
        env:
          PM: ${{ steps.d.outputs.pm }}
          LOCK: ${{ steps.d.outputs.lockfile }}
          TIER: ${{ inputs.tier }}
          EVENT: ${{ github.event_name }}
          FAIL_ON: ${{ inputs.fail-on }}
          DELTA_ONLY: ${{ inputs.vuln-delta-only }}
          BLOCK_UNFIX: ${{ inputs.vuln-block-unfixable }}
          CLASSIFIER: |
            import json, os

            fail_on = os.environ["FAIL_ON"]
            delta_only = os.environ["DELTA_ONLY"] == "true"
            block_unfix = os.environ["BLOCK_UNFIX"] == "true"

            def load(path):
                try:
                    with open(path) as fh:
                        data = json.load(fh)
                except Exception:
                    return []
                deps = data.get("dependencies", []) if isinstance(data, dict) else data
                rows = []
                for dep in deps:
                    for v in (dep.get("vulns") or []):
                        rows.append({
                            "name": dep.get("name"),
                            "version": dep.get("version"),
                            "id": v.get("id"),
                            "fixable": bool(v.get("fix_versions")),
                        })
                return rows

            head = load("head.json")
            base_ids = {r["id"] for r in load("base.json")}

            block, warn = [], []
            for r in head:
                introduced = r["id"] not in base_ids
                should_block = (
                    fail_on != "none"
                    and (introduced or not delta_only)
                    and (r["fixable"] or block_unfix)
                )
                r["tags"] = ", ".join([
                    "introduced" if introduced else "inherited",
                    "fixable" if r["fixable"] else "no-fix",
                ])
                (block if should_block else warn).append(r)

            def table(title, rows):
                if not rows:
                    return ""
                lines = [f"### {title}", "", "| Package | Version | Advisory | Notes |", "|---|---|---|---|"]
                for r in rows:
                    lines.append(f"| {r['name']} | {r['version']} | {r['id']} | {r['tags']} |")
                return "\n".join(lines) + "\n\n"

            summary = "## Dependency vulnerabilities\n\n"
            summary += table("❌ Blocking", block)
            summary += table("⚠️ Advisory (non-blocking)", warn)
            if not head:
                summary += "No known vulnerabilities found.\n"
            sp = os.environ.get("GITHUB_STEP_SUMMARY")
            if sp:
                with open(sp, "a") as fh:
                    fh.write(summary)

            for r in warn:
                print(f"::warning::{r['name']} {r['version']} {r['id']} ({r['tags']}) — not blocking.")
            if block:
                for r in block:
                    print(f"::error::{r['name']} {r['version']} {r['id']} ({r['tags']}).")
                raise SystemExit(1)
            print("::notice::Dependency vuln gate passed (0 blocking findings).")
        run: |
          set -uo pipefail
          if [ "$LOCK" = "none" ]; then
            if [ "$TIER" = "dev" ]; then
              echo "::warning::No lockfile found — skipping pip-audit (dev tier)."
              exit 0
            fi
            echo "::error::No dependency manifest found (poetry.lock / Pipfile.lock / uv.lock / pdm.lock / requirements.txt / pyproject.toml). Required at qa/main."
            exit 1
          fi
          uv pip install pip-audit

          # Audit a project directory to JSON. pip-audit exits non-zero when it
          # finds vulns; we capture the report with `|| true` and decide ourselves.
          audit_dir() {  # $1 = dir, $2 = output json
            ( cd "$1" && case "$PM" in
                poetry) poetry export -f requirements.txt --without-hashes -o /tmp/_req.txt 2>/dev/null && pip-audit -r /tmp/_req.txt -f json ;;
                pipenv) pip-audit -r Pipfile.lock -f json ;;
                # uv: audit what uv.lock installs. `pip-audit .` re-resolves
                # pyproject.toml with pip, ignoring the lock and [tool.uv]
                # overrides. --no-deps: the lock is already the full set. uv
                # export prints what it writes, so its stdout is dropped. A
                # checkout without uv.lock (say, the PR base) keeps the old way.
                uv)     if [ -f uv.lock ]; then
                          uv export --frozen --no-dev --no-hashes --no-emit-workspace -o /tmp/_req.txt >/dev/null \
                            && pip-audit -r /tmp/_req.txt --no-deps --disable-pip -f json
                        else pip-audit . -f json; fi ;;
                pdm)    pip-audit . -f json ;;
                pip)    if [ -f requirements.txt ]; then pip-audit -r requirements.txt -f json
                        else pip-audit . -f json; fi ;;
              esac ) > "$2" 2>/dev/null || true
            [ -s "$2" ] || echo '{"dependencies":[]}' > "$2"
          }

          audit_dir "$PWD" head.json

          # Delta baseline: audit the same project at the PR base, to tell vulns
          # this PR introduced from ones it merely inherited. The full clone
          # already has origin/<base>; do not --depth fetch (it cuts history).
          echo '{"dependencies":[]}' > base.json
          if [ "$DELTA_ONLY" = "true" ] && [ "$EVENT" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            if git worktree add --detach /tmp/base-tree "origin/$GITHUB_BASE_REF" >/dev/null 2>&1; then
              audit_dir /tmp/base-tree base.json
              git worktree remove --force /tmp/base-tree >/dev/null 2>&1 || true
            else
              echo "::warning::Could not resolve base branch for delta vuln scan — treating all findings as introduced."
            fi
          fi

          python3 -c "$CLASSIFIER"

      # ── Tests ──
      - name: Run pytest
        if: ${{ !cancelled() && steps.d.outputs.tests == 'true' && steps.install.outcome == 'success' }}
        shell: bash   # works on the macos/windows matrix entries too
        env:
          TEST_CMD: ${{ inputs.test-command }}
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          if [ -n "$TEST_CMD" ]; then
            bash -c "$TEST_CMD"
          else
            PATHS="$TEST_PATHS"
            if [ -z "$PATHS" ]; then
              for p in tests test src/tests apps; do
                [ -d "$p" ] && PATHS="$PATHS $p"
              done
              [ -z "$PATHS" ] && PATHS="."
            fi
            # shellcheck disable=SC2086 # PATHS is a deliberate space-separated arg list
            pytest --cov --cov-report=xml --cov-report=term -q $PATHS
          fi
      # Coverage upload + gate run once (first matrix entry, Linux).
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && env.FIRST == 'true' && hashFiles('coverage.xml') != '' && runner.os == 'Linux' }}
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Patch-coverage gate: of the lines this PR changed, how many are tested?
      - name: Diff coverage gate
        if: ${{ !cancelled() && env.FIRST == 'true' && hashFiles('coverage.xml') != '' && runner.os == 'Linux' }}
        uses: Attri-Inc/dev-kit/.github/actions/diff-coverage@main
        with:
          report: coverage.xml
          format: cobertura
          base-ref: ${{ github.base_ref }}
          min-coverage: ${{ inputs.diff-coverage-min }}
          enforcement: ${{ inputs.diff-coverage-enforcement }}
