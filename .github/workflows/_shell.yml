name: _shell

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner for jobs (default ubuntu-latest; set self-hosted to use your own runners).'
        type: string
        default: 'ubuntu-latest'
      tier:
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  shell:
    name: ShellCheck + shfmt
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
      # Pinned, not "latest": resolving latest calls the GitHub API without a
      # token, and every runner behind one office IP shares its 60 calls/hour.
      # Preinstalled on self-hosted runner images when the version matches.
      - name: Ensure shfmt
        if: ${{ !cancelled() }}
        shell: bash
        env:
          WANT: 'v3.14.1'
        run: |
          set -uo pipefail
          have="$(shfmt --version 2>/dev/null || true)"
          if [ "$have" = "$WANT" ]; then
            echo "::notice::shfmt ${WANT} preinstalled — skipping download."
          else
            echo "::notice::shfmt ${WANT} not present (found: ${have:-none}) — installing."
            set -e
            sudo curl -fsSLo /usr/local/bin/shfmt \
              "https://github.com/mvdan/sh/releases/download/${WANT}/shfmt_${WANT}_linux_amd64"
            sudo chmod +x /usr/local/bin/shfmt
          fi
      # shfmt is style enforcement, not correctness — repos vary widely on
      # indent, and reformatting legacy scripts on every onboarding is too
      # aggressive. Always warn-only; shellcheck above catches real bugs.
      - name: shfmt (format check)
        if: ${{ !cancelled() }}
        run: shfmt -d -i 2 -ci .
        continue-on-error: true
