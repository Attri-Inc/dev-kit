name: _typescript

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner for jobs (default ubuntu-latest; set self-hosted to use your own runners).'
        type: string
        default: 'ubuntu-latest'
      tier:
        type: string
        required: true
      run-medium:
        type: string
        default: 'false'
      fail-on:
        type: string
        default: 'high'
      node-version:
        type: string
        default: '20'
      diff-coverage-min:
        description: 'Minimum % of CHANGED lines that must be covered by tests (patch coverage).'
        type: string
        default: '80'
      diff-coverage-enforcement:
        description: 'warn (advisory, default) | fail (block PRs below diff-coverage-min).'
        type: string
        default: 'warn'
      frontend-quality-enforcement:
        description: |
          Lighthouse (perf + a11y + CWV) and bundle-size budgets: 'warn' (default)
          | 'fail'. Consume-if-present (runs only when a lighthouserc / size-limit
          / bundlewatch config exists).
        type: string
        default: 'warn'
      test-os:
        description: |
          JSON array of runners for the job matrix. gate.yml passes the resolved
          runner. Extra entries run the tests only. Default ["ubuntu-latest"].
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ONE job for lint, types, security, audit, tests and build: dependencies
  # are installed once, and the job waits for one runner instead of seven.
  # Every check step uses `!cancelled()` so all findings show in one run.
  # On a multi-entry test-os matrix, only the first entry runs the
  # OS-independent checks; the others run tests only.
  typescript:
    name: Lint, types, security, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.test-os) }}
    runs-on: ${{ matrix.os }}
    env:
      FIRST: ${{ strategy.job-index == 0 }}
    steps:
      # fetch-depth: 0 so the diff-coverage gate can find the PR merge-base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect tooling
        id: d
        shell: bash
        env:
          RUN_MEDIUM: ${{ inputs.run-medium }}
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then PM=pnpm
          elif [ -f yarn.lock ]; then PM=yarn
          else PM=npm
          fi
          BIOME=false; { [ -f biome.json ] || [ -f biome.jsonc ]; } && BIOME=true
          TSCONFIG=false; [ -f tsconfig.json ] && TSCONFIG=true
          TESTS=false; grep -qE '"(test|jest|vitest)"' package.json 2>/dev/null && TESTS=true
          BUILD=false; grep -qE '"build"\s*:' package.json 2>/dev/null && BUILD=true
          RUN_BUILD=false; [ "$BUILD" = true ] && [ "$RUN_MEDIUM" = true ] && RUN_BUILD=true

          # Lifecycle (postinstall) scripts are where supply-chain credential
          # stealers run. Allow them only when tests or the build will run,
          # which need them; lint, tsc and audit do not.
          SCRIPTS=false
          if [ "$TESTS" = true ] || [ "$RUN_BUILD" = true ]; then SCRIPTS=true; fi
          {
            echo "pm=$PM"
            echo "use-biome=$BIOME"
            echo "has-tsconfig=$TSCONFIG"
            echo "has-tests=$TESTS"
            echo "run-build=$RUN_BUILD"
            echo "install-scripts=$SCRIPTS"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::pm=$PM biome=$BIOME tsconfig=$TSCONFIG tests=$TESTS build=$RUN_BUILD install-scripts=$SCRIPTS"

      # ── Checks that need no node_modules (before the install) ──
      - name: Setup Biome
        if: env.FIRST == 'true' && steps.d.outputs.use-biome == 'true'
        uses: biomejs/setup-biome@v2
      - name: Lint + format (Biome)
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.use-biome == 'true' }}
        run: biome ci .

      # Semgrep is a plain Python package, installed rather than run via
      # `container: semgrep/semgrep`: a self-hosted runner gets an empty Docker
      # daemon per job, so the image was re-pulled every run.
      # Self-hosted runner images ship it preinstalled at the pinned version.
      - name: Check for Semgrep
        id: semgrep
        if: env.FIRST == 'true' && inputs.run-medium == 'true'
        shell: bash
        env:
          WANT: '1.97.0'
        run: |
          set -uo pipefail
          have="$(semgrep --version 2>/dev/null | head -1 || true)"
          if [ "$have" = "$WANT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Semgrep ${WANT} preinstalled — skipping install."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Semgrep ${WANT} not present (found: ${have:-none}) — installing."
          fi
      - uses: actions/setup-python@v7
        if: steps.semgrep.outputs.present == 'false'
        with:
          python-version: '3.12'
      - name: Install Semgrep
        if: steps.semgrep.outputs.present == 'false'
        run: pip install --disable-pip-version-check semgrep==1.97.0
      - name: Security (Semgrep)
        if: ${{ !cancelled() && steps.semgrep.outcome == 'success' }}
        run: |
          semgrep scan \
            --config p/javascript --config p/typescript \
            --config p/owasp-top-ten --config p/nodejs \
            --sarif --output=semgrep.sarif \
            --error || true
      - uses: github/codeql-action/upload-sarif@v4
        # Private repos without GHAS can't upload SARIF — don't block the gate.
        continue-on-error: true
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' && !github.event.repository.private }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # ── One install for everything below ──
      # setup-node's `cache: pnpm` calls pnpm to find the cache directory, so
      # pnpm must be on PATH first. npm and yarn come with the runner image.
      - name: Setup pnpm
        if: steps.d.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.d.outputs.pm }}
      # No `corepack enable`: pnpm/action-setup already put the repo's pnpm on
      # PATH, and corepack's shim breaks pnpm 11+ ("Cannot find module
      # .../bin/pnpm.cjs").
      - name: Install
        id: install
        if: ${{ !cancelled() }}
        shell: bash   # Windows runners default to PowerShell
        env:
          PM: ${{ steps.d.outputs.pm }}
          SCRIPTS: ${{ steps.d.outputs.install-scripts }}
        run: |
          set -euo pipefail
          ARGS=(); [ "$SCRIPTS" = true ] || ARGS=(--ignore-scripts)
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile "${ARGS[@]}" ;;
            yarn) yarn install --frozen-lockfile "${ARGS[@]}" ;;
            npm)  npm ci "${ARGS[@]}" ;;
          esac
      # --ignore-scripts skips the postinstall hook that generators like Prisma
      # run from, so type-aware lint and tsc can't resolve the generated client.
      # Re-run only known first-party generators by name.
      - name: Codegen (first-party generators)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.d.outputs.install-scripts != 'true' }}
        uses: Attri-Inc/dev-kit/.github/actions/js-codegen@main

      # ── Checks that need node_modules ──
      # Prefer the project's own `lint` script, so the repo's pinned ESLint
      # version + config are used (ESLint 8 legacy config and ESLint 9 flat
      # config alike). Fall back to `eslint .` only if no script exists.
      - name: Lint (ESLint)
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.use-biome != 'true' && steps.install.outcome == 'success' }}
        shell: bash
        env:
          PM: ${{ steps.d.outputs.pm }}
        run: |
          HAS_LINT=$(jq -r '.scripts.lint // empty' package.json 2>/dev/null)
          if [ -n "$HAS_LINT" ]; then
            echo "::notice::Running consumer's \`$PM run lint\` (script: $HAS_LINT)"
            case "$PM" in
              pnpm) pnpm run lint ;;
              yarn) yarn lint ;;
              npm)  npm run lint ;;
            esac
          else
            echo "::notice::No \`lint\` npm script — falling back to \`npx eslint .\`"
            npx --yes eslint .
          fi
      - name: Type check (tsc)
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.has-tsconfig == 'true' && steps.install.outcome == 'success' }}
        run: npx --no-install tsc --noEmit
      - name: Dependency vulns (audit)
        if: ${{ !cancelled() && env.FIRST == 'true' && inputs.run-medium == 'true' && steps.install.outcome == 'success' }}
        continue-on-error: ${{ inputs.fail-on != 'critical' }}
        shell: bash
        env:
          PM: ${{ steps.d.outputs.pm }}
        run: |
          case "$PM" in
            pnpm) pnpm audit --prod --audit-level=high ;;
            yarn) yarn audit --groups dependencies --level high ;;
            npm)  npm audit --omit=dev --audit-level=high ;;
          esac

      # ── Tests (every matrix entry) ──
      - name: Run tests
        if: ${{ !cancelled() && steps.d.outputs.has-tests == 'true' && steps.install.outcome == 'success' }}
        shell: bash
        env:
          PM: ${{ steps.d.outputs.pm }}
        run: |
          case "$PM" in
            pnpm) pnpm run --if-present test ;;
            yarn) yarn test ;;
            npm)  npm test --if-present ;;
          esac
      # Consume-if-present: gate on a coverage report the test script emits
      # (jest/vitest lcov or cobertura). Coverage flags are NOT forced onto an
      # unknown test runner, which could break the test step.
      - name: Locate coverage report
        id: cov
        if: ${{ !cancelled() && env.FIRST == 'true' && github.event_name == 'pull_request' && runner.os == 'Linux' && steps.d.outputs.has-tests == 'true' }}
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "report=coverage/lcov.info" >> "$GITHUB_OUTPUT"
            echo "format=lcov" >> "$GITHUB_OUTPUT"
          elif [ -f coverage/cobertura-coverage.xml ]; then
            echo "report=coverage/cobertura-coverage.xml" >> "$GITHUB_OUTPUT"
            echo "format=cobertura" >> "$GITHUB_OUTPUT"
          else
            echo "report=" >> "$GITHUB_OUTPUT"
            echo "::notice::No coverage report found (looked for coverage/lcov.info and coverage/cobertura-coverage.xml). Enable coverage in your test runner (e.g. jest --coverage --coverageReporters=lcov, or vitest with coverage.reporter=['lcov']) to activate the patch-coverage gate."
          fi
      - uses: actions/setup-python@v7
        if: ${{ !cancelled() && steps.cov.outputs.report != '' }}
        with:
          python-version: '3.12'
      - name: Diff coverage gate
        if: ${{ !cancelled() && steps.cov.outputs.report != '' }}
        uses: Attri-Inc/dev-kit/.github/actions/diff-coverage@main
        with:
          report: ${{ steps.cov.outputs.report }}
          format: ${{ steps.cov.outputs.format }}
          base-ref: ${{ github.base_ref }}
          min-coverage: ${{ inputs.diff-coverage-min }}
          enforcement: ${{ inputs.diff-coverage-enforcement }}

      # ── Build + frontend budgets (qa/main tier) ──
      - name: Build
        id: build
        if: ${{ !cancelled() && env.FIRST == 'true' && steps.d.outputs.run-build == 'true' && steps.install.outcome == 'success' }}
        shell: bash
        env:
          PM: ${{ steps.d.outputs.pm }}
        run: |
          case "$PM" in
            pnpm) pnpm build ;;
            yarn) yarn build ;;
            npm)  npm run build ;;
          esac
      # Consume-if-present: no-ops unless a lighthouserc / size-limit /
      # bundlewatch config exists. Runs after the build, so budgets measure it.
      - name: Frontend quality (a11y + perf budgets)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: Attri-Inc/dev-kit/.github/actions/frontend-quality@main
        with:
          enforcement: ${{ inputs.frontend-quality-enforcement }}
