name: 'AI provenance check'
description: |
  Detects AI-authored commits via three signals: a Co-Authored-By trailer, a
  known bot account, or an AI generation-footer marker (e.g. "Generated with
  Claude Code") — the last of which fires even on commits attributed to a human
  email. When detected: confirms attribution, optionally requires a CLAUDE.md
  update for large diffs, and adds an `ai-authored` label for downstream policy.
  Per PNAS Nexus 2026 — labels do NOT bias reviewers, so this is for policy/forensics only.
  LIMITATION: AI code committed under a human email with NO trailer and NO
  generation marker is undetectable by design — this is best-effort provenance,
  not a guarantee. Enforcement (require-trailer) is what makes the policy stick.
author: 'Attri Inc'

inputs:
  require-trailer:
    description: 'Fail if AI bot is co-author but Co-Authored-By trailer missing'
    required: false
    default: 'true'
  require-claude-md-on-large-diff:
    description: 'Files-changed threshold above which CLAUDE.md must be updated'
    required: false
    default: '20'
  add-pr-label:
    description: 'Auto-add "ai-authored" label to PR if AI commits detected'
    required: false
    default: 'true'

outputs:
  ai-authored:
    description: 'true if any commit in the PR was AI-authored'
    value: ${{ steps.check.outputs.ai-authored }}
  trailer-present:
    description: 'true if Co-Authored-By: Claude trailer found on at least one commit'
    value: ${{ steps.check.outputs.trailer-present }}

runs:
  using: 'composite'
  steps:
    - id: check
      shell: bash
      env:
        BASE: ${{ github.base_ref }}
        EVENT: ${{ github.event_name }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUM: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        if [ -n "${BASE:-}" ]; then
          git fetch origin "$BASE" --depth=50 2>/dev/null || true
          RANGE="origin/${BASE}..HEAD"
        else
          RANGE="HEAD~10..HEAD"
        fi

        COMMITS=$(git rev-list "$RANGE" 2>/dev/null || echo "")
        if [ -z "$COMMITS" ]; then
          echo "ai-authored=false" >> "$GITHUB_OUTPUT"
          echo "trailer-present=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        AI_FOUND=false
        TRAILER_FOUND=false
        AI_NO_TRAILER=()

        AI_BOT_PATTERN='claude\[bot\]|noreply@anthropic\.com|copilot\[bot\]|cursor-agent|aider-bot|devin-ai|v0\[bot\]|codex-cli|sweep-ai\[bot\]'
        TRAILER_PATTERN='Co-Authored-By:\s*(Claude|Copilot|Cursor|Aider|Devin)'
        # Generation-footer markers emitted by AI coding tools. These appear in
        # the commit body even when the commit is attributed to a HUMAN email —
        # which is the common case here, since identity-check forces commits to
        # a corporate address, so bot-authorship alone never fires. Treating a
        # generation marker as an AI signal lets the trailer requirement enforce
        # attribution on human-attributed AI commits too. (audit H2)
        AI_GEN_MARKER='Generated with \[?Claude Code|🤖 Generated with|Generated by (Claude|Copilot|Cursor|Aider|Devin)|Assisted-by:\s*(Claude|Copilot|Cursor|Aider|Devin)'

        for sha in $COMMITS; do
          author=$(git log -1 --format='%an <%ae>' "$sha")
          body=$(git log -1 --format='%B' "$sha")

          author_is_ai=false
          if echo "$author" | grep -qiE "$AI_BOT_PATTERN"; then
            author_is_ai=true
          fi

          trailer_present=false
          if echo "$body" | grep -qiE "$TRAILER_PATTERN"; then
            trailer_present=true
            TRAILER_FOUND=true
          fi

          marker_present=false
          if echo "$body" | grep -qiE "$AI_GEN_MARKER"; then
            marker_present=true
          fi

          # Any of: bot author, canonical trailer, or a generation footer.
          if [ "$author_is_ai" = true ] || [ "$trailer_present" = true ] || [ "$marker_present" = true ]; then
            AI_FOUND=true
          fi

          # Flag when there is an AI signal (bot author OR generation marker)
          # but the canonical Co-Authored-By trailer is absent — this now also
          # catches human-attributed AI commits, not just bot accounts.
          if { [ "$author_is_ai" = true ] || [ "$marker_present" = true ]; } && [ "$trailer_present" = false ]; then
            AI_NO_TRAILER+=( "${sha:0:7} ($author)" )
          fi
        done

        echo "ai-authored=$AI_FOUND" >> "$GITHUB_OUTPUT"
        echo "trailer-present=$TRAILER_FOUND" >> "$GITHUB_OUTPUT"

        # Require trailer when AI is the author
        if [ "${{ inputs.require-trailer }}" = "true" ] && [ ${#AI_NO_TRAILER[@]} -gt 0 ]; then
          {
            echo "## ❌ AI-authored commits missing Co-Authored-By trailer"
            echo ""
            echo "These commits appear to be AI-authored but don't have the standard attribution trailer:"
            echo ""
            for c in "${AI_NO_TRAILER[@]}"; do echo "- \`$c\`"; done
            echo ""
            echo "Add this trailer (single blank line above) to commit messages:"
            echo '```'
            echo "Co-Authored-By: Claude <noreply@anthropic.com>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::AI-authored commits missing Co-Authored-By trailer."
          exit 1
        fi

        # Large-diff CLAUDE.md update gate
        if [ "$AI_FOUND" = "true" ] && [ -n "${BASE:-}" ]; then
          THRESH=${{ inputs.require-claude-md-on-large-diff }}
          CHANGED_COUNT=$(git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$CHANGED_COUNT" -ge "$THRESH" ]; then
            if ! git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null | grep -qE '(^|/)CLAUDE\.md$'; then
              echo "::warning::AI changed $CHANGED_COUNT files (threshold $THRESH) but didn't update CLAUDE.md. Consider documenting the change in CLAUDE.md."
              {
                echo "## ⚠️ Large AI-authored change without CLAUDE.md update"
                echo ""
                echo "$CHANGED_COUNT files changed (threshold: $THRESH)."
                echo "If this changes architecture, conventions, or developer workflow, update CLAUDE.md."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
        fi

        # Auto-label PR
        if [ "$AI_FOUND" = "true" ] && [ "${{ inputs.add-pr-label }}" = "true" ] && [ "$EVENT" = "pull_request" ] && [ -n "$PR_NUM" ]; then
          gh api -X POST "repos/$REPO/issues/$PR_NUM/labels" \
            -f "labels[]=ai-authored" 2>/dev/null || \
            echo "::notice::Could not add ai-authored label (may not exist yet — create it via repo settings)."
        fi

        if [ "$AI_FOUND" = "true" ]; then
          echo "::notice::Detected AI-authored commits. Labeled and policy-checked."
        else
          echo "::notice::No AI-authored commits detected."
        fi
