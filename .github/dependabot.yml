# Keep our own pinned actions current. The kit is the source of truth for downstream
# repos, so its own pins are kept fresh by Dependabot weekly.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "deps"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
