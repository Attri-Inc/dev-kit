# devkit.ini — per-repo configuration for the dev kit.
# Copy to the root of your repo. Everything is optional; delete what you don't use.
# Reference: docs/config-file.md
#
# Rules of thumb:
#   - One `key = value` per line. Comments go on their own line (# or ;).
#   - Check and key names are case-insensitive.
#   - On pull requests the copy on the BASE branch applies; a change to this
#     file takes effect after it is merged.

[kit]
# false turns the whole kit off for this repo (same as the .attri-dev-kit-skip file).
enabled = true
# reason = archived; read-only since 2026-09

[skip]
# check = reason. The reason shows up in the run summary and the compliance evidence.
# Full list of names: docs/config-file.md. Protected checks (secrets-scan,
# hygiene.identity, code-scan.trojan-source, dep-scan.malicious-deps) cannot be skipped.
#
# python.type-check = mypy breaks on generated protobuf stubs, tracked in ENG-123
# hygiene.typos = clinical vocabulary trips the dictionary
# typescript.frontend-quality = no Lighthouse budget yet, revisit after the redesign

[settings]
# key = value, where key is any gate input except the locked ones
# (runner, allowed-author-domains, identity-enforcement, secret-scan-historic-mode,
# attestation-frequency). The file wins over the workflow's `with:` block.
#
# python-version = 3.12
# python-test-command = uv run pytest -m "not slow"
# pr-size-soft-limit = 600
# pr-size-hard-limit = 900
# fail-on = critical
